name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a PR supersedes its older run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  threert:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            renderer
            renderer/voxel-core
      - run: cd renderer && cargo build --release --locked
      # The voxel engine's core builds for the browser (wasm32: players run the game there) and passes its tests.
      - run: rustup target add wasm32-unknown-unknown
      - run: cd renderer/voxel-core && cargo build --release --locked --target wasm32-unknown-unknown && cargo test --release --locked
      # Its edits are deterministic: the same script natively and in wasm32 leaves the same voxels (ROADMAP § 6 step 6).
      - run: node tools/voxel-determinism.ts

[package]
name = "pocket-web-render30"
edition = "2024"
version = "0.16.0"
license = "LicenseRef-Pocket3D"
description = "devices/web/pocket-web-render (PocketJS) ported from wgpu 25 to wgpu 30"

[lib]
name = "pocket_web_render"

[dependencies]
pocket-drivers = { path = "../vendor/pocketjs/engine/drivers" }
pocket-spec = { path = "../vendor/pocketjs/engine/spec" }
pocket-draw-ops = { path = "../vendor/pocketjs/engine/render/draw-ops" }
pocket-tri-batch = { path = "../vendor/pocketjs/engine/render/tri-batch" }
pocket-glyph-pages = { path = "../vendor/pocketjs/engine/render/glyph-pages" }
pocket-tex-cache = { path = "../vendor/pocketjs/engine/render/tex-cache" }
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

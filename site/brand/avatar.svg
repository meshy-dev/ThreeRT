<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="ThreeRT">
  <!-- ThreeRT for a profile picture (X, Discord): the mark on black, drawn for a round crop. The triangle's centroid is
       the centre of the square, so its three corners sit equally far from the rim of the circle the platforms cut. -->
  <defs>
    <linearGradient id="ray" x1="11.59" y1="32" x2="32" y2="12.36" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF6A13"/><stop offset=".5" stop-color="#FFB454"/><stop offset="1" stop-color="#FFEBC4"/></linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="1.8"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="#000"/>
  <g transform="translate(211.13 204.49) scale(10.9552)">
    <path d="M11.59 32 L32 12.36 L38.81 39.86 Z" fill="none" stroke="#FFAD4E" stroke-width="8.0" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/>
    <path d="M18.39 59.5 L4.78 4.5 L59.22 20.21 Z" fill="none" stroke="#ECE8E1" stroke-width="4.2" stroke-linejoin="round"/>
    <path d="M11.59 32 L32 12.36 L38.81 39.86 Z" fill="url(#ray)" fill-opacity="0.2" stroke="url(#ray)" stroke-width="4.2" stroke-linejoin="round"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ThreeRT">
  <!-- ThreeRT "Orbit": a triangle (three.js's primitive) and the one closed light path that bounces inside it.
       The path is a period-6 billiard orbit (angle in = angle out at every edge) and draws the triangle's 3x3 grid. -->
  <defs><linearGradient id="ray" x1="10" y1="56" x2="54" y2="20" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF6A13"/><stop offset=".5" stop-color="#FFB454"/><stop offset="1" stop-color="#FFEBC4"/></linearGradient><filter id="glow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="1.5"/></filter></defs>
  <path d="M23.333 54 L40.667 23.978 L23.333 23.978 L40.667 54 L49.333 38.989 L14.667 38.989 Z" fill="none" stroke="#FF9A3A" stroke-width="5" stroke-linejoin="round" opacity=".45" filter="url(#glow)"/>
  <path d="M32 8.967 L58 54 L6 54 Z" fill="none" stroke="#ECE8E1" stroke-width="3" stroke-linejoin="round"/>
  <path d="M23.333 54 L40.667 23.978 L23.333 23.978 L40.667 54 L49.333 38.989 L14.667 38.989 Z" fill="none" stroke="url(#ray)" stroke-width="2.6" stroke-linejoin="round"/>
</svg>

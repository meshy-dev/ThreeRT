<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ThreeRT">
  <!-- ThreeRT "Three bounces": the three.js triangle (equilateral, tilted 16 degrees as three.js draws it) and the closed
       light path inside it. The path is three.js's own inner triangle, which is also the shortest billiard orbit a
       triangle has: three bounces, each leaving its edge at the angle it arrived. The mesh is bone; the path is lit.
       js/mark.js draws the same thing live (the lockup and the landing page's large mark) and spins it on hover. -->
  <defs><linearGradient id="ray" x1="11.59" y1="32" x2="32" y2="12.36" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF6A13"/><stop offset=".5" stop-color="#FFB454"/><stop offset="1" stop-color="#FFEBC4"/></linearGradient><filter id="glow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="1.8"/></filter></defs>
  <path d="M11.59 32 L32 12.36 L38.81 39.86 Z" fill="none" stroke="#FFAD4E" stroke-width="6" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/>
  <path d="M18.39 59.5 L4.78 4.5 L59.22 20.21 Z" fill="none" stroke="#ECE8E1" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M11.59 32 L32 12.36 L38.81 39.86 Z" fill="url(#ray)" fill-opacity=".16" stroke="url(#ray)" stroke-width="3.2" stroke-linejoin="round"/>
</svg>
